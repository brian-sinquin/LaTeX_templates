name: Build LaTeX CVs

on:
  push:
    branches: [main, master, hermes]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-cv:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cv:
          - name: CV_FR
            dir: CV
            file: main
          - name: Postdoc_EN
            dir: CV_postdoc/EN
            file: main
          - name: Postdoc_FR
            dir: CV_postdoc/FR
            file: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: dante-ev/latex-action@2021-A
        with:
          root_file: ${{ matrix.cv.file }}.tex
          working_directory: ${{ matrix.cv.dir }}
          compiler: latexmk
          args: -pdflatex -silent -bibtex-cond1 -use-make

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cv.name }}
          path: ${{ matrix.cv.dir }}/${{ matrix.cv.file }}.pdf
          retention-days: 90