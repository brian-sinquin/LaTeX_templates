name: Build LaTeX CVs

on:
  push:
    branches: [main, master, hermes]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-cv:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cv:
          - name: CV_FR
            dir: CV
          - name: Postdoc_EN
            dir: CV_postdoc/EN
          - name: Postdoc_FR
            dir: CV_postdoc/FR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (pdflatex + bibtex + pdflatex x2)
        uses: dante-ev/latex-action@2023-A
        with:
          root_file: main.tex
          working_directory: ${{ matrix.cv.dir }}
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error

      - name: Run BibTeX
        uses: dante-ev/latex-action@2023-A
        with:
          root_file: main
          working_directory: ${{ matrix.cv.dir }}
          compiler: bibtex
          args: ''

      - name: Compile LaTeX (pass 2)
        uses: dante-ev/latex-action@2023-A
        with:
          root_file: main.tex
          working_directory: ${{ matrix.cv.dir }}
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error

      - name: Compile LaTeX (pass 3)
        uses: dante-ev/latex-action@2023-A
        with:
          root_file: main.tex
          working_directory: ${{ matrix.cv.dir }}
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cv.name }}
          path: ${{ matrix.cv.dir }}/main.pdf
          retention-days: 90